name: Reproduce and validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reproduce_real:
        description: Download the pinned UCI archive and refit the full real benchmark
        type: boolean
        default: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e .
      - run: gridledger --out .
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: python -m gridledger.audit --root .
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: gridledger-verify --root .
      - run: python -c "from pathlib import Path; from gridledger.verify import check_manifest; check_manifest(Path('.'), 'results/real_analysis_manifest.json')"
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run test:browser-model
      - run: npm run test:real-model
      - run: npm run test:contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  reproduce-real:
    if: github.event_name == 'workflow_dispatch' && inputs.reproduce_real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: gridledger-fetch --root .
      - run: gridledger-real --root .
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: gridledger-verify --root .
