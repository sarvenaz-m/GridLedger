[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridledger"
version = "1.0.0"
description = "Reproducible energy forecasting, residual monitoring and prediction provenance"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0", "scipy==1.17.0"]

[project.scripts]
gridledger = "gridledger.pipeline:main"
gridledger-audit = "gridledger.audit:main"

[tool.setuptools.packages.find]
where = ["src"]
